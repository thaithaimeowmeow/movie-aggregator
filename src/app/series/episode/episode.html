<div class="bg-[#222] rounded-lg p-2 flex flex-col w-[280px] cursor-pointer hover:bg-[#2a2a2a] transition-colors">

    <div class="relative w-full aspect-video rounded-lg overflow-hidden flex-shrink-0" (click)="openDetail()">
        <img #posterImg loading="lazy" [src]="posterUrl" [alt]="" (error)="useFallback()"
            class="w-full h-full object-cover" />
        <div class="absolute top-1.5 left-1.5 bg-black/80 text-white text-xs px-2 py-0.5 rounded">
            {{episode.air_date}}
        </div>
    </div>

    <h3 class="mt-2 font-bold text-white text-base line-clamp-1">Episode {{ episode.episode_number}}</h3>

    <p class="text-gray-400 text-sm line-clamp-3 leading-snug mt-1">
        {{ episode.overview}}
    </p>

</div>
