<main class="p-5">
  <div class="flex flex-wrap gap-5 justify-center">

    @let episodes = (episodes$ | async);

    @if (episodes === null) {
    @for (item of skeletonArray; track $index) {
    <div class="w-[280px] h-[230px] rounded-lg bg-[#1a1a1a] animate-pulse"></div>
    }
    } @else {
    @for (episode of episodes; track episode.id) {
    <app-episode [seriesId]="seriesId" [episode]="episode"></app-episode>
    }
    }

  </div>
</main>
