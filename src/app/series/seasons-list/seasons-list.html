<main>
  <div class="video-grid">

    @let seasons = (seasons$ | async);

    @if (seasons === null) {
    @for (item of skeletonArray; track $index) {
    <div class="movie-skeleton"></div>
    }
    } @else {
    @for (season of seasons; track season.id) {
    <app-seasons [season]="season" [seriesId]="id"></app-seasons>
    }
    }

  </div>
</main>
