<main>

  <div class="video-grid">

    <div class="video-item">
      <a class="thumbnail" routerLink="/series">
        <img [src]="seriesPoster" alt="Series">
        <div class="play-icon">📺</div>
      </a>
      <h3>Series</h3>
      <p>Browse TV series</p>
    </div>

    <div class="video-item">
      <a class="thumbnail" routerLink="/movies">
        <img [src]="moviesPoster" alt="Movies">
        <div class="play-icon">🎬</div>
      </a>
      <h3>Movies</h3>
      <p>Browse movies</p>
    </div>

  </div>

</main>
