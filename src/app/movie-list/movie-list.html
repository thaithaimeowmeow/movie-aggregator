<main>
  <div class="video-grid" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="50"
    [scrollWindow]="true" (scrolled)="onScrolled()">
    @for (movie of movies; track movie.id) {
    <app-movie-card [movie]="movie" [pageType]="pageType"></app-movie-card>
    }

    @if (loading) {
    @for (item of skeletonArray; track $index) {
    <div class="movie-skeleton"></div>
    }
    }

  </div>
</main>
