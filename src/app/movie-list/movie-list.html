<main>

  <div class="video-grid">

    @if ((movies$ | async)?.length) {

      @for (movie of (movies$ | async); track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }

    } @else {

      @for (item of skeletonArray; track $index) {
        <div class="movie-skeleton"></div>
      }

    }

  </div>

</main>
