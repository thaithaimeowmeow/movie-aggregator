<div class="video-item">
    <!-- <a class="thumbnail" [routerLink]="['/', pageType, movie.id]"> -->
    <div class="thumbnail cursor-pointer" (click)="openDetail()">
        <div class="poster">

            <img #posterImg loading="lazy" [src]="posterUrl" [alt]="movie.title" (error)="useFallback()" />

        </div>
        <div class="date-overlay">
            {{ movie.release_date || movie.first_air_date }}
        </div>

        <div class="rating-overlay font-bold">
            ⭐ {{ movie.vote_average }}
        </div>

        <!-- <div class="network">
            Netflix
        </div> -->
    </div>
    <!-- </a> -->

    <h3 class="title font-bold text-lg text-white">{{ movie.title || movie.original_name}}</h3>

    <p class="description text-white text-sm">
        {{ movie.overview }}
    </p>



</div>
