<header
    class="fixed top-0 left-0 right-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-sm border-b border-white/10 px-6 py-4 flex items-center gap-4">

    <a (click)="goBack()" class="text-white font-bold text-xl tracking-tight cursor-pointer whitespace-nowrap">
        {{ AppName }}
        @if (pageType) {
        <span class="text-gray-500"> / </span>
        <span class="text-gray-300 capitalize">{{ pageType }}</span>
        }
    </a>
    @if (canSearch == true) {

    <div
        class="ml-auto flex items-center gap-2 bg-white/10 rounded-lg px-3 py-1.5 w-64 focus-within:bg-white/15 transition-colors">
        <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
        </svg>
        <input type="text" placeholder="Search" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
            class="bg-transparent text-white text-sm outline-none w-full placeholder-gray-500" />
    </div>

    }

</header>
